<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f1e9">
<title>写真パズル 3×3</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 12px 28px; background: #f4f1e9; color: #263238;
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    touch-action: manipulation;
  }
  h1 { text-align:center; font-size:22px; margin: 5px 0 4px; }
  .help { text-align:center; font-size:13px; line-height:1.6; margin:0 auto 12px; color:#52616b; }
  .status { text-align:center; font-weight:700; margin:8px 0 10px; min-height:24px; }
  #stage { width:min(100%, 680px); margin:auto; }
  #board {
    position:relative; width:100%; aspect-ratio: 1 / 1; margin:auto;
    background:#dedbd2; border:3px solid #5c665f; border-radius:9px;
    overflow:hidden; box-shadow:0 3px 10px #0002;
    background-image:
      linear-gradient(to right, transparent calc(33.333% - 1px), #66736c88 calc(33.333% - 1px), #66736c88 calc(33.333% + 1px), transparent calc(33.333% + 1px)),
      linear-gradient(to right, transparent calc(66.666% - 1px), #66736c88 calc(66.666% - 1px), #66736c88 calc(66.666% + 1px), transparent calc(66.666% + 1px)),
      linear-gradient(to bottom, transparent calc(33.333% - 1px), #66736c88 calc(33.333% - 1px), #66736c88 calc(33.333% + 1px), transparent calc(33.333% + 1px)),
      linear-gradient(to bottom, transparent calc(66.666% - 1px), #66736c88 calc(66.666% - 1px), #66736c88 calc(66.666% + 1px), transparent calc(66.666% + 1px));
  }
  .slot { position:absolute; width:33.3333%; height:33.3333%; border:1px dashed #89928c66; }
  .piece {
    position:absolute; width:33.3333%; height:33.3333%;
    background-image:var(--photo); background-size:300% 300%;
    border:2px solid #fff; border-radius:4px; box-shadow:0 3px 9px #0004;
    transform-origin:center; touch-action:none; user-select:none; -webkit-user-select:none;
    cursor:grab; transition: box-shadow .12s;
  }
  .piece.selected { box-shadow:0 0 0 3px #ffb300, 0 5px 13px #0005; z-index:50 !important; }
  .piece.placed { border:1px solid #ffffff99; border-radius:0; box-shadow:none; }
  #tray {
    position:relative; width:100%; height: min(72vw, 360px); min-height:250px;
    margin-top:14px; border:2px dashed #b9b5aa; border-radius:12px;
    background:#ebe7dc; overflow:hidden;
  }
  #tray::before {
    content:"ピース置き場"; position:absolute; top:7px; left:10px;
    color:#8b887e; font-size:12px; pointer-events:none;
  }
  .buttons { display:flex; justify-content:center; gap:10px; margin:13px 0; }
  button {
    border:0; border-radius:24px; padding:11px 20px; font-size:14px; font-weight:700;
    background:#455e52; color:white; box-shadow:0 2px 5px #0002;
  }
  button.secondary { background:#777d78; }
  #win { display:none; text-align:center; background:#fff7d6; border:2px solid #e7bd4a;
    border-radius:12px; padding:14px; margin:12px 0; font-size:18px; font-weight:800; }
  .note { text-align:center; font-size:11px; color:#777; margin-top:8px; }
  @media (min-width:600px) { #tray { height:300px; } }
</style>
</head>
<body>
<h1>写真パズル 🧩</h1>
<p class="help">ピースをそのまま指で動かして、正方形パネルにはめよう！<br>同じピースを素早く2回タップすると90°回転します。</p>
<div id="stage">
  <div class="status" id="status">正しい向きで9ピースをそろえよう！</div>
  <div id="board" aria-label="パズルのパネル"></div>
  <div id="win">🎉 完成！おめでとうございます！</div>
  <div id="tray" aria-label="ピース置き場"></div>
  <div class="buttons">
    <button id="reset">最初から</button>
    <button id="hint" class="secondary">遊び方</button>
  </div>
  <div class="note">正方形の写真を3×3の9枚に分割。回転は90°ずつです。</div>
</div>

const board = document.getElementById('board');
const tray = document.getElementById('tray');
const statusEl = document.getElementById('status');
const win = document.getElementById('win');
const pieces = [];
let zTop = 10, selected = null, lastTap = {id:null, time:0};
const rand = (a,b) => Math.random()*(b-a)+a;

function makeGame() {
  board.querySelectorAll('.piece').forEach(e=>e.remove());
  tray.querySelectorAll('.piece').forEach(e=>e.remove());
  pieces.length = 0; zTop = 10; selected = null; win.style.display='none';
  for (let i=0;i<9;i++) {
    const row=Math.floor(i/3), col=i%3;
    const el=document.createElement('div');
    el.className='piece';
    el.style.setProperty('--photo', `url("${PHOTO}")`);
    el.style.backgroundPosition = `${col*50}% ${row*50}%`;
    el.dataset.correct = i;
    el.dataset.rotation = '0';
    el.dataset.placed = 'false';
    // Scatter pieces below the board, with enough spacing to pick them up.
    const x = 2 + (i%3)*32 + rand(-2,2);
    const y = 14 + Math.floor(i/3)*27 + rand(-2,2);
    el.style.left = x+'%'; el.style.top = y+'%';
    el.style.transform='rotate(0deg)';
    el.style.zIndex=String(zTop++);
    tray.appendChild(el);
    pieces.push(el);
    attach(el);
  }
  statusEl.textContent='正しい向きで9ピースをそろえよう！';
}
function attach(el) {
  let drag=null, moved=false;
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const r=el.getBoundingClientRect();
    drag={
      pointerId:e.pointerId,
      offsetX:e.clientX-r.left,
      offsetY:e.clientY-r.top,
      startX:e.clientX, startY:e.clientY,
      originalParent:el.parentElement,
      originalLeft:el.style.left,
      originalTop:el.style.top,
      originalWidth:el.style.width,
      originalHeight:el.style.height,
      originalPosition:el.style.position
    };
    moved=false;
    select(el);
    // Switch to viewport coordinates while dragging: the piece follows the finger
    // smoothly even when it crosses the boundary between tray and board.
    el.style.position='fixed';
    el.style.left=r.left+'px';
    el.style.top=r.top+'px';
    el.style.width=r.width+'px';
    el.style.height=r.height+'px';
    el.style.zIndex='9999';
  });
  el.addEventListener('pointermove', e=>{
    if(!drag || e.pointerId!==drag.pointerId) return;
    const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    if(moved) {
      el.style.left=(e.clientX-drag.offsetX)+'px';
      el.style.top=(e.clientY-drag.offsetY)+'px';
    }
  });
  el.addEventListener('pointerup', e=>{
    if(!drag || e.pointerId!==drag.pointerId) return;
    const wasMoved=moved;
    const now=Date.now();
    const d=drag;
    drag=null;
    if(!wasMoved && lastTap.id===el.dataset.correct && now-lastTap.time<450) {
      restorePosition(el,d);
      rotatePiece(el);
      lastTap={id:null,time:0};
      return;
    }
    if(!wasMoved) {
      restorePosition(el,d);
      lastTap={id:el.dataset.correct,time:now};
      return;
    }
    lastTap={id:null,time:0};
    const b=board.getBoundingClientRect();
    const centerX=e.clientX;
    const centerY=e.clientY;
    if(centerX>=b.left && centerX<=b.right && centerY>=b.top && centerY<=b.bottom) {
      const col=Math.max(0,Math.min(2,Math.floor((centerX-b.left)/(b.width/3))));
      const row=Math.max(0,Math.min(2,Math.floor((centerY-b.top)/(b.height/3))));
      placeOnBoard(el,row*3+col);
    } else {
      // Release back into the tray at the finger's final position.
      tray.appendChild(el);
      el.style.position='absolute';
      el.style.width='33.3333%';
      el.style.height='33.3333%';
      const t=tray.getBoundingClientRect();
      const pw=t.width/3, ph=t.width/3;
      el.style.left=Math.max(0,Math.min(66.666,((centerX-t.left-pw/2)/t.width)*100))+'%';
      el.style.top=Math.max(8,Math.min(65,((centerY-t.top-ph/2)/t.height)*100))+'%';
      el.style.zIndex=String(zTop++);
      if(el.dataset.placed==='true') {
        el.dataset.placed='false'; delete el.dataset.cell;
        el.classList.remove('placed');
      }
    }
    checkWin();
  });
  el.addEventListener('pointercancel',()=>{
    if(!drag) return;
    restorePosition(el,drag);
    drag=null;
  });
  // Prevent the browser's synthetic double-click zoom on supported browsers.
  el.addEventListener('dblclick',e=>e.preventDefault());
}
function restorePosition(el,d) {
  el.style.position=d.originalPosition || 'absolute';
  el.style.width=d.originalWidth || '33.3333%';
  el.style.height=d.originalHeight || '33.3333%';
  el.style.left=d.originalLeft;
  el.style.top=d.originalTop;
  el.style.zIndex=String(zTop++);
  d.originalParent.appendChild(el);
}
function placeOnBoard(el,idx) {
  const occupant=pieces.find(p=>p!==el && p.dataset.placed==='true' && Number(p.dataset.cell)===idx);
  if(occupant) returnToTray(occupant);
  const col=idx%3, row=Math.floor(idx/3);
  el.dataset.placed='true'; el.dataset.cell=String(idx);
  board.appendChild(el);
  el.classList.add('placed');
  el.style.position='absolute';
  el.style.width='33.3333%';
  el.style.height='33.3333%';
  el.style.left=(col*100/3)+'%';
  el.style.top=(row*100/3)+'%';
  el.style.zIndex=String(idx+1);
}
function select(el) {
  if(selected) selected.classList.remove('selected');
  selected=el; el.classList.add('selected'); el.style.zIndex=String(zTop++);
}
function rotatePiece(el) {
  let r=(Number(el.dataset.rotation)+90)%360;
  el.dataset.rotation=String(r);
  el.style.transform=`rotate(${r}deg)`;
  checkWin();
}
function returnToTray(el) {
  el.dataset.placed='false'; delete el.dataset.cell;
  el.classList.remove('placed');
  tray.appendChild(el);
  el.style.left=rand(3,64)+'%'; el.style.top=rand(12,65)+'%';
  el.style.zIndex=String(zTop++);
}
function checkWin() {
  const done=pieces.every(p=>p.dataset.placed==='true' &&
    Number(p.dataset.cell)===Number(p.dataset.correct) &&
    Number(p.dataset.rotation)===0);
  const count=pieces.filter(p=>p.dataset.placed==='true' &&
    Number(p.dataset.cell)===Number(p.dataset.correct) &&
    Number(p.dataset.rotation)===0).length;
  statusEl.textContent=`正解：${count} / 9`;
  if(done) { win.style.display='block'; statusEl.textContent='全ピース正解！'; }
}
document.getElementById('reset').addEventListener('click',makeGame);
document.getElementById('hint').addEventListener('click',()=>{
  alert('ピースを指で押さえたまま動かして、上のパネルに置きます。向きが違うときは、ピースを素早く2回タップすると90°回転します。間違った場所に置いたピースも、もう一度つかんで動かせます。');
});
makeGame();
</script>
